<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exact Layout PDF to Spreadsheet</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS (xlsx) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    body {
      background: linear-gradient(-45deg, #0b132b, #3a0ca3, #00f5d4, #1e1b4b, #10b981);
      background-size: 400% 400%;
      animation: gradient 14s ease infinite;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    input[type=file]::file-selector-button {
      margin-right: 1rem;
      border: none;
      background: rgba(16, 185, 129, 0.15);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      color: #a7f3d0;
      cursor: pointer;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(52, 211, 153, 0.4);
      transition: all 0.2s ease;
    }

    input[type=file]::file-selector-button:hover {
      background: rgba(16, 185, 129, 0.3);
      border-color: rgba(110, 231, 183, 0.7);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 p-6 flex items-center justify-center font-sans">
  
  <div class="w-full max-w-lg bg-white/10 backdrop-blur-2xl border border-emerald-400/30 rounded-3xl shadow-[0_8px_32px_0_rgba(16,185,129,0.25)] p-8">
    <header class="border-b border-indigo-300/20 pb-6 mb-6 text-center">
      <div class="inline-flex p-3 rounded-2xl bg-gradient-to-br from-indigo-500/30 via-cyan-500/20 to-emerald-400/30 border border-emerald-300/40 text-emerald-300 mb-3 shadow-[0_0_15px_rgba(52,211,153,0.3)]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight drop-shadow-md">Exact Layout PDF Converter</h1>
      <p class="text-xs text-emerald-200/90 mt-2 font-medium">Auto-routing & failover server anti-antre.</p>
    </header>

    <div class="space-y-5">
      <!-- Input API Key -->
      <div class="bg-indigo-950/40 p-4 rounded-2xl border border-emerald-400/20 shadow-inner backdrop-blur-md">
        <label class="block text-xs font-semibold text-emerald-100 mb-1">Gemini API Key:</label>
        <input type="password" id="api-key" placeholder="Tempel API Key di sini (AIzaSy...)" class="w-full bg-black/20 border border-emerald-300/30 text-white rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-emerald-400 focus:outline-none placeholder-white/30" />
      </div>

      <!-- Input File PDF -->
      <div class="bg-indigo-950/40 p-4 rounded-2xl border border-emerald-400/20 shadow-inner backdrop-blur-md">
        <label class="block text-xs font-semibold text-emerald-100 mb-2">Pilih File PDF:</label>
        <input type="file" id="pdf-file" accept="application/pdf" class="block w-full text-xs text-emerald-100 cursor-pointer" />
      </div>

      <!-- Format Output -->
      <div class="bg-indigo-950/40 p-4 rounded-2xl border border-emerald-400/20 shadow-inner backdrop-blur-md">
        <label class="block text-xs font-semibold text-emerald-100 mb-2">Pilih Format Output:</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-2.5 p-3 rounded-xl border border-emerald-400/30 bg-white/5 cursor-pointer hover:bg-emerald-500/20 transition">
            <input type="radio" name="output-format" value="xlsx" checked class="accent-emerald-400" />
            <div>
              <div class="text-xs font-bold text-white">XLSX</div>
              <div class="text-[10px] text-emerald-300/80">Microsoft Excel</div>
            </div>
          </label>

          <label class="flex items-center gap-2.5 p-3 rounded-xl border border-indigo-400/30 bg-white/5 cursor-pointer hover:bg-indigo-500/20 transition">
            <input type="radio" name="output-format" value="ods" class="accent-indigo-400" />
            <div>
              <div class="text-xs font-bold text-white">ODS</div>
              <div class="text-[10px] text-indigo-200/80">LibreOffice Calc</div>
            </div>
          </label>
        </div>
      </div>

      <!-- Tombol Eksekusi -->
      <button onclick="convertWithAI()" id="btn-convert" class="w-full bg-gradient-to-r from-indigo-600/80 via-blue-600/80 to-emerald-500/80 hover:from-indigo-500 hover:to-emerald-400 text-white font-bold py-3 px-6 rounded-2xl transition duration-300 border border-emerald-300/50 shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2 text-sm">
        Konversi Sesuai Tata Letak Asli
      </button>
    </div>

    <!-- Status Log -->
    <div id="status" class="mt-6 p-4 rounded-2xl text-xs text-center font-bold hidden backdrop-blur-md border shadow-inner"></div>
  </div>

  <script>
    function showStatus(text, type = 'info') {
      const status = document.getElementById('status');
      status.innerText = text;
      status.classList.remove('hidden');

      if (type === 'error') {
        status.className = 'mt-6 p-4 rounded-2xl text-xs text-center font-bold block bg-red-500/20 text-red-200 border border-red-500/30 backdrop-blur-md';
      } else if (type === 'success') {
        status.className = 'mt-6 p-4 rounded-2xl text-xs text-center font-bold block bg-emerald-500/20 text-emerald-200 border border-emerald-400/40 backdrop-blur-md shadow-[0_0_15px_rgba(16,185,129,0.2)]';
      } else {
        status.className = 'mt-6 p-4 rounded-2xl text-xs text-center font-bold block bg-indigo-500/20 text-indigo-200 border border-indigo-400/30 backdrop-blur-md';
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    const wait = ms => new Promise(res => setTimeout(res, ms));

    // Urutan model dari yang paling low-traffic/stabil
    const modelCandidates = [
      'gemini-3.5-flash-lite',
      'gemini-3.5-flash',
      'gemini-3.6-flash',
      'gemini-3.6-flash-lite'
    ];

    async function executeWithSmartFallback(apiKey, base64Data, promptText) {
      let errorDetails = '';

      for (let attempt = 0; attempt < 2; attempt++) {
        for (const model of modelCandidates) {
          try {
            showStatus(`⏳ Memproses via ${model}...`, 'info');

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: promptText },
                    {
                      inline_data: {
                        mime_type: "application/pdf",
                        data: base64Data
                      }
                    }
                  ]
                }],
                generationConfig: {
                  response_mime_type: "application/json"
                }
              })
            });

            const result = await response.json();

            if (result.error) {
              const errMsg = result.error.message || '';
              errorDetails = errMsg;
              // Jika server sibuk (demand tinggi) atau not found, coba server model berikutnya
              if (errMsg.includes('high demand') || errMsg.includes('not found') || errMsg.includes('ResourceExhausted')) {
                console.warn(`Model ${model} antre: ${errMsg}. Mengalihkan...`);
                continue;
              }
              throw new Error(errMsg);
            }

            return { result, modelUsed: model };
          } catch (err) {
            errorDetails = err.message;
            console.warn(`Gagal pada ${model}:`, err);
          }
        }
        // Jeda sejenak sebelum putaran retry kedua
        await wait(1500);
      }

      throw new Error(`Server Google sedang sangat padat. Tunggu sekitar 15-30 detik lalu tekan tombol lagi. (${errorDetails})`);
    }

    async function convertWithAI() {
      const apiKey = document.getElementById('api-key').value.trim();
      const fileInput = document.getElementById('pdf-file');
      const selectedFormat = document.querySelector('input[name="output-format"]:checked').value;
      const btn = document.getElementById('btn-convert');

      if (!apiKey) {
        showStatus('⚠️ Masukkan Gemini API Key terlebih dahulu.', 'error');
        return;
      }
      if (fileInput.files.length === 0) {
        showStatus('⚠️ Pilih file PDF terlebih dahulu.', 'error');
        return;
      }

      const file = fileInput.files[0];
      btn.disabled = true;

      try {
        showStatus('⏳ Membaca file PDF...', 'info');
        const base64Data = await fileToBase64(file);

        const promptText = `
        You are an expert OCR & Document Layout Reconstruction Engine.
        Task: Transcribe the EXACT layout and structure of all tables and content from the attached PDF into a 2D spreadsheet matrix.

        CRITICAL LAYOUT RULES:
        1. Maintain exact spatial alignment. If text is visually located in column 4, place it in index 3 of the array, filling empty preceding cells with empty strings ("").
        2. Do NOT shift columns to the left when cells are empty. Preserve blank cells.
        3. Multi-line cells in a single row must remain inside that same row (combine with space or newline).
        4. Preserve all headers, merged header structures, and numeric values exactly as shown.

        Output ONLY a valid JSON object matching this structure:
        {
          "sheets": [
            {
              "name": "Sheet1",
              "rows": [
                ["Col 1", "Col 2", "Col 3", "Col 4"],
                ["Data 1", "", "Data 3", "Data 4"]
              ]
            }
          ]
        }
        `;

        const { result, modelUsed } = await executeWithSmartFallback(apiKey, base64Data, promptText);

        const rawJsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
        const parsedData = JSON.parse(rawJsonText);

        if (!parsedData.sheets || parsedData.sheets.length === 0) {
          throw new Error('Tidak ada tabel yang berhasil diekstrak.');
        }

        const workbook = XLSX.utils.book_new();

        parsedData.sheets.forEach((sheetInfo, idx) => {
          const worksheet = XLSX.utils.aoa_to_sheet(sheetInfo.rows || []);
          const sheetName = sheetInfo.name ? sheetInfo.name.substring(0, 31) : `Halaman_${idx + 1}`;
          XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
        });

        const fileNameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
        if (selectedFormat === 'ods') {
          XLSX.writeFile(workbook, `${fileNameWithoutExt}_exact_layout.ods`, { bookType: 'ods' });
        } else {
          XLSX.writeFile(workbook, `${fileNameWithoutExt}_exact_layout.xlsx`, { bookType: 'xlsx' });
        }

        showStatus(`✨ Sukses! Layout berhasil direkonstruksi rapi via ${modelUsed} (.${selectedFormat.toUpperCase()})`, 'success');

      } catch (err) {
        console.error(err);
        showStatus(`❌ Terjadi kendala: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
